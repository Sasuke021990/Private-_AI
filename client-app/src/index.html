<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auth Proxy Client</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header" style="position: relative;">
      <div class="logo">🚀 Auth Proxy Tunnel</div>
      <p class="subtitle">Securely expose your local apps to the world.</p>
      <button id="quit-btn" style="position: absolute; top: 0; right: 0; background: transparent; color: #ef4444; width: auto; padding: 5px; margin: 0; font-size: 12px;">Power Off</button>
    </div>

    <form id="global-config-form">
      <div class="section-title">Global Configuration</div>
      <div class="input-group">
        <label for="vpsIp">VPS IP Address</label>
        <input type="text" id="vpsIp" placeholder="e.g. 203.57.85.144" required>
      </div>
      
      <div class="input-group">
        <label for="vpsRootPassword">VPS Root Password</label>
        <input type="password" id="vpsRootPassword" placeholder="SSH Password" required>
      </div>

      <div class="input-group">
        <label for="dashboardPassword">Dashboard Admin Password</label>
        <input type="password" id="dashboardPassword" placeholder="API Password" required>
      </div>

      <div class="toggle-group">
        <label class="toggle-switch">
          <input type="checkbox" id="runAtStartup">
          <span class="slider"></span>
        </label>
        <span class="toggle-label">Run automatically at Startup</span>
      </div>
    </form>

    <div class="divider"></div>

    <form id="connect-form">
      <div class="section-title">Add New Tunnel</div>
      <div class="row">
        <div class="input-group half">
          <label for="localPort">Local Port</label>
          <input type="number" id="localPort" placeholder="e.g. 1235" required>
        </div>
        <div class="input-group half">
          <label for="remotePath">Public Path</label>
          <input type="text" id="remotePath" placeholder="e.g. /ai" required>
        </div>
      </div>
      <div class="input-group">
        <label for="routeType">Tunnel Type</label>
        <select id="routeType">
          <option value="app">Web App (Fix UI Assets)</option>
          <option value="api">Raw API (No Rewriting)</option>
        </select>
      </div>
      <button type="submit" id="connect-btn">Connect Tunnel</button>
    </form>
    
    <div id="status-message" class="hidden"></div>

    <div class="section-title" style="margin-top: 30px;">Active Tunnels</div>
    <div id="tunnels-list">
      <!-- Dynamic Tunnels will appear here -->
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
