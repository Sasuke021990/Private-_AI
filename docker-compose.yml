services:
  db:
    image: postgres:15-alpine
    container_name: auth-proxy-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-auth_proxy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  auth-proxy:
    image: auth-proxy-app
    build: .
    container_name: auth-proxy
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ~/.ssh/authorized_keys:/usr/src/app/authorized_keys
    depends_on:
      - db

volumes:
  postgres_data:
